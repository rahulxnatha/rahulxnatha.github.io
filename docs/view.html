<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Documents</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
  font-family:
          "Segoe UI", SegoeUI, "Helvetica Neue", Helvetica, Arial, sans-serif;
    background:#f5f5f5;
}

header{
    background:#1a73e8;
    color:white;
    text-align:center;
    padding:18px;
    font-size:28px;
    font-weight:400;
    border-radius: 8px;
}

section{
    margin:20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    overflow:hidden;
    
}

h2{
    padding:15px 20px;
    background:#ffffff;
    color:#102847;
    border-left:6px solid #0e2c55;
    font-size:28px;
    font-weight:400;
  
}

iframe{
    width:100%;
    height:600px;
    border-radius: 8px;
    border:none;
}


.docs-button {
  display: inline-block;

  margin-top: 20px;
  padding: 12px 34px;

  border: none;
  border-radius: 12px;

  background: #d4d4d8;
  color: #111;

  font-family: inherit;
  font-size: 16px;
  font-weight: 500;

  text-decoration: none;
  text-align: center;

  cursor: pointer;

  transition:
    transform 0.15s,
    background 0.15s;
}

.docs-button:hover {
  background: #e4e4e7;
  transform: translateY(-1px);
}

.docs-button:active {
  transform: translateY(0);
}

.docs-button:focus-visible {
  outline: 2px solid #16c60c;
  outline-offset: 3px;
}
</style>
</head>

<body>

<div id="viewer"></div>

</body>

<script>
    const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzIWFNsu6ugUZapOte41HXwSDOfC--TSdXTAWIIg7H19e3bm5svEapdwJHaOqkobFhkDg/exec";

const params = new URLSearchParams(window.location.search);

const docsId = params.get("id");

const docsNode =
  localStorage.getItem("DOCSnode");

if (!docsId) {

  document.body.innerHTML =
    "<h2>Invalid DOCSid.</h2>";

} else if (!docsNode) {

  document.body.innerHTML =
    "<h2>This browser has no DOCSlicense.</h2>";

} else {

  fetch(
    SCRIPT_URL +
      "?id=" +
      encodeURIComponent(docsId) +
      "&node=" +
      encodeURIComponent(docsNode)
  )

    .then(r => r.json())

    .then(data => {

      if (!data.html) {

        document.body.innerHTML =
          "<h2>Access denied.</h2>";

        return;

      }

      document.body.innerHTML = data.html;

    })

    .catch(() => {

      document.body.innerHTML =
        "<h2>Unable to contact DOCSviewer.</h2>";

    });

}
</script>

</html>
