<body>
<header><h1>Wo ist der Ball?</h1></header>
<main class="wrap">
 <div class="scene" id="scene" aria-label="3D-Szene mit Hund, Hundehütte und Ball"></div>

<script type="module">
import * as THREE from 'three';
const host=document.getElementById('scene');

box(house,2.05,1.3,1.62,wood,0,.72,0);box(house,.035,1.28,.04,trim,-1.01,.72,.83);box(house,.035,1.28,.04,trim,1.01,.72,.83);

box(house,.82,.09,.19,gold,-.22,.075,.91);
// Gable end silhouette on the front and rear, as two clean triangles (no stray roof triangles).
function triangleShape(points,depth,material,x,y,z){const shape=new THREE.Shape();shape.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)shape.lineTo(points[i][0],points[i][1]);shape.closePath();const geo=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:false});const mesh=new THREE.Mesh(geo,material);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;house.add(mesh);return mesh;}

triangleShape([[-1.025,1.32],[1.025,1.32],[0,2.05]],.055,sideWood,0,0,-.835);
// Correct roof: two solid rectangular sloped planes. Both share one ridge and have no free-standing triangle.
const roofAngle=Math.atan2(.62,.93);const slopeLen=Math.sqrt(.93*.93+.62*.62);const roofDepth=1.98;const roofThickness=.12;
const leftRoof=box(house,slopeLen,roofThickness,roofDepth,roofMat,-.465,1.77,0);leftRoof.rotation.z=roofAngle;
const rightRoof=box(house,slopeLen,roofThickness,roofDepth,roofMat,.465,1.77,0);rightRoof.rotation.z=-roofAngle;
// Roof edge fascia along the eaves and a narrow ridge cap, all aligned to the roof.
const leftEave=box(house,.10,.15,2.04,trim,-.91,1.48,0);leftEave.rotation.z=roofAngle;
const rightEave=box(house,.10,.15,2.04,trim,.91,1.48,0);rightEave.rotation.z=-roofAngle;
const ridge=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,2.04,12),gold);ridge.rotation.x=Math.PI/2;ridge.position.set(0,2.10,0);ridge.castShadow=true;house.add(ridge);
// Parallel decorative roof strips: run front-to-back and sit flush on each sloping plane.
for(let side of [-1,1]){for(let i=0;i<7;i++){const u=(i+1)/8;const x=side*u*.89;const y=2.08-u*.59;const strip=box(house,.075,.035,2.00,i%2===0?gold:mat('#a74f35'),x,y,0);strip.rotation.z=side<0?roofAngle:-roofAngle;}}
// Dog built from smooth ellipsoids, oriented toward the house.

// Keep the dog clearly on the screen-left and in front of the house.
// Its muzzle points diagonally toward the doorway and the camera can see its face.

function ellipsoid(parent,color,pos,scale,rough=.82){const m=new THREE.Mesh(new THREE.SphereGeometry(1,28,20),mat(color,rough));m.position.set(...pos);m.scale.set(...scale);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
ellipsoid(dog,'#c98a45',[0,.66,0],[.53,.42,.32]);ellipsoid(dog,'#dba867',[.40,.91,.015],[.32,.39,.29]);ellipsoid(dog,'#e8c99b',[.51,.79,.19],[.25,.19,.20]);ellipsoid(dog,'#d9a66a',[.54,1.12,.015],[.29,.31,.27]);ellipsoid(dog,'#f1d8ad',[.69,1.00,.17],[.22,.14,.18]);ellipsoid(dog,'#30241e',[.83,1.04,.27],[.055,.05,.045]);ellipsoid(dog,'#34231b',[.49,1.17,.245],[.035,.04,.025]);

for(const x of [-.31,.31])for(const z of [-.20,.20]){const leg=ellipsoid(dog,'#b9783c',[x,.27,z],[.12,.28,.12]);ellipsoid(dog,'#e6c69a',[x,.095,z+.015],[.15,.09,.14]);}
const tail=ellipsoid(dog,'#c98a45',[-.60,.88,-.015],[.25,.075,.075]);tail.rotation.z=.65;

const positions={behind:[1.95,.25,-.1],infront:[-1.25,.25,-.15],beside:[.45,.25,1.45],on:[.45,2.35,0],under:[.45,.25,0],between:[-1.05,.25,-.2]};let current='beside';let target=new THREE.Vector3(...positions.beside);let dragging=false;let dragOffset=new THREE.Vector3();
function updateSentence(pos){const de={behind:'Der Ball ist hinter der Hundehütte.',infront:'Der Ball ist vor der Hundehütte.',beside:'Der Ball ist neben der Hundehütte.',on:'Der Ball ist auf der Hundehütte.',under:'Der Ball ist unter der Hundehütte.',between:'Der Ball ist zwischen dem Hund und der Hundehütte.'};const en={behind:'The ball is behind the doghouse.',infront:'The ball is in front of the doghouse.',beside:'The ball is next to the doghouse.',on:'The ball is on the doghouse.',under:'The ball is under the doghouse.',between:'The ball is between the dog and the doghouse.'};document.getElementById('sentenceDe').textContent=de[pos];document.getElementById('sentenceEn').textContent=en[pos];document.querySelectorAll('button[data-pos]').forEach(b=>b.classList.toggle('active',b.dataset.pos===pos));}
function setPosition(pos){current=pos;target.set(...positions[pos]);updateSentence(pos);}
document.querySelectorAll('button[data-pos]').forEach(b=>b.addEventListener('click',()=>setPosition(b.dataset.pos)));
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(host);resize();
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),groundPlane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();function pointerPos(e){const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;}
